bookdown::html_chapters:
  css: [css/style.css, css/toc.css]

bookdown::gitbook:  # generates a HTML book
  dev: svglite
  css: css/style.css
  split_by: section
  toc_depth: 2
  config:
    toc:
      collapse: none
      before: |
         <li><a href="https://github.com/USEPA/EIB-TSD/tree/main/2023/NEI" target="_blank" rel="noopener">View Source Files</a></li>
      after: |
         <li><a href="https://github.com/USEPA/EIB-TSD/tree/main/2023/NEI" target="_blank" rel="noopener">View Source Files</a></li>
    download: [pdf]  # enables a PDF download link
    sharing:
      facebook: no
      twitter: no
      all: no
    search:
      engine: fuse

bookdown::pdf_book:
  includes:
    in_header: latex/preamble.tex
    before_body: latex/before_body.tex
  toc: true
  lof: true
  lot: true
  fig_caption: true
  keep_tex: yes
  dev: "cairo_pdf"
  latex_engine: lualatex
  citation_package: natbib
  template: latex/template.tex
  pandoc_args: --top-level-division=chapter
  quote_footer: ["\\VA{", "}{}"]
